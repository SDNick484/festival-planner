name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv run --python ${{ matrix.python-version }} pytest -q

  leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv run python scripts/leak_check.py

  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned release, checksum verified)
        run: |
          set -eu
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          ./gitleaks version
      - name: Scan full history
        run: ./gitleaks git --redact --no-banner --verbose .

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -t festival-planner:ci .
      - name: Run it with the example config and check /healthz
        run: |
          set -eu
          cp config.example.toml "$RUNNER_TEMP/config.toml"
          # DEV_AUTH_EMAIL and FLASK_ENV are deliberately unset: this is the production path.
          docker run -d --name fp -p 8000:8000 \
            -v "$RUNNER_TEMP/config.toml:/app/config.toml:ro" festival-planner:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then echo; exit 0; fi
            sleep 1
          done
          docker logs fp
          exit 1
      - name: Container runs as a non-root user and reports healthy
        run: |
          set -eu
          test "$(docker exec fp id -u)" = "10001"
          for _ in $(seq 1 45); do
            status=$(docker inspect --format '{{ .State.Health.Status }}' fp)
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          docker logs fp
          exit 1
